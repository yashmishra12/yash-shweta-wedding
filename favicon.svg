<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A1A"/>
      <stop offset="100%" style="stop-color:#5C1111"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="50%" style="stop-color:#E8C99B"/>
      <stop offset="100%" style="stop-color:#C4926E"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <!-- Thin gold ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.6"/>

  <!-- Decorative inner ring with subtle pattern -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.3"/>

  <!-- Y letter -->
  <text x="190" y="320" font-family="Georgia, 'Playfair Display', serif" font-size="220" font-weight="600" fill="url(#gold)" text-anchor="middle" letter-spacing="-8">Y</text>

  <!-- Ampersand - small, elegant, centered between -->
  <text x="256" y="280" font-family="Georgia, 'Playfair Display', serif" font-size="60" font-style="italic" fill="url(#gold)" text-anchor="middle" opacity="0.7">&amp;</text>

  <!-- S letter -->
  <text x="330" y="320" font-family="Georgia, 'Playfair Display', serif" font-size="220" font-weight="600" fill="url(#gold)" text-anchor="middle" letter-spacing="-8">S</text>

  <!-- Small decorative diamond below -->
  <polygon points="256,370 264,380 256,390 248,380" fill="url(#gold)" opacity="0.5"/>
</svg>
